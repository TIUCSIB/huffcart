<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="吹卡带 HuffCart——Android 上的 FC、GB、GBC 复古游戏机">
  <title>吹卡带 HuffCart——Android 上的 FC、GB、GBC 复古游戏机</title>
  <!-- 背景：米白（与应用浅色主题一致） -->
  <rect width="1200" height="340" fill="#F6F1E7"/>
  <rect x="0" y="0" width="1200" height="8" fill="#E60012"/>

  <!-- 左列：标题区 -->
  <g>
    <!-- 像素卡带图标 -->
    <g transform="translate(66,58)">
      <rect x="0" y="0" width="30" height="34" rx="3" fill="#E60012"/>
      <rect x="5" y="6" width="20" height="12" fill="#F6F1E7" opacity="0.92"/>
      <rect x="9" y="9" width="12" height="3" fill="#B50010"/>
      <rect x="11" y="13" width="8" height="2" fill="#B50010"/>
      <rect x="4" y="26" width="4" height="8" fill="#B50010"/>
      <rect x="13" y="26" width="4" height="8" fill="#B50010"/>
      <rect x="22" y="26" width="4" height="8" fill="#B50010"/>
    </g>
    <text x="108" y="84" font-family="'Courier New',monospace" font-size="22" font-weight="bold" letter-spacing="6" fill="#E60012">HUFFCART</text>

    <text x="64" y="176" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="84" font-weight="900" fill="#1F1F1F">吹卡带</text>
    <rect x="66" y="196" width="272" height="6" fill="#E60012"/>

    <text x="64" y="248" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="30" font-weight="700" fill="#33291F">Android 上的 FC · GB · GBC 复古游戏机</text>
    <text x="64" y="288" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="20" fill="#8A7E6E">libretro 核心驱动 · 像素完美缩放 · 局域网联机 1–4 人 · 按住倒带</text>
  </g>

  <!-- 右列：深色手柄面板（取自应用游戏屏视觉） -->
  <g>
    <rect x="640" y="36" width="508" height="268" rx="16" fill="#1F1F1F"/>
    <!-- 像素点阵纹理 -->
    <g fill="#2A2A2A">
      <rect x="664" y="60" width="6" height="6"/><rect x="688" y="60" width="6" height="6"/><rect x="712" y="60" width="6" height="6"/>
      <rect x="664" y="84" width="6" height="6"/><rect x="688" y="84" width="6" height="6"/><rect x="712" y="84" width="6" height="6"/>
      <rect x="664" y="108" width="6" height="6"/><rect x="688" y="108" width="6" height="6"/><rect x="712" y="108" width="6" height="6"/>
    </g>
    <!-- 卡槽 + 吹卡带场景 -->
    <g transform="translate(700,88)">
      <rect x="0" y="88" width="120" height="26" rx="4" fill="#3A3A3A"/>
      <rect x="10" y="94" width="100" height="4" fill="#141414"/>
      <rect x="22" y="34" width="76" height="58" rx="4" fill="#E60012" transform="rotate(-8 60 63)"/>
      <rect x="32" y="44" width="56" height="18" fill="#F6F1E7" opacity="0.9" transform="rotate(-8 60 53)"/>
      <rect x="38" y="50" width="30" height="4" fill="#B50010" transform="rotate(-8 53 52)"/>
      <!-- 吹气线条 -->
      <g stroke="#F7B500" stroke-width="5" stroke-linecap="round">
        <line x1="60" y1="24" x2="60" y2="8"/>
        <line x1="38" y1="30" x2="28" y2="16"/>
        <line x1="82" y1="30" x2="92" y2="16"/>
      </g>
    </g>
    <!-- 十字键 -->
    <g transform="translate(886,120)" fill="#373737">
      <rect x="26" y="0" width="28" height="96" rx="4"/>
      <rect x="0" y="26" width="80" height="28" rx="4"/>
      <circle cx="40" cy="40" r="10" fill="#2A2A2A"/>
    </g>
    <!-- A / B 按钮 -->
    <g>
      <circle cx="1030" cy="150" r="26" fill="#C21E20"/>
      <circle cx="1030" cy="146" r="26" fill="#F22C2E"/>
      <text x="1030" y="155" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#FFFFFF">B</text>
      <circle cx="1096" cy="150" r="26" fill="#C21E20"/>
      <circle cx="1096" cy="146" r="26" fill="#F22C2E"/>
      <text x="1096" y="155" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#FFFFFF">A</text>
    </g>
    <!-- SELECT / START 胶囊 -->
    <g fill="#383838">
      <rect x="920" y="238" width="64" height="16" rx="8"/>
      <rect x="1000" y="238" width="64" height="16" rx="8"/>
    </g>
    <!-- 底部红条（应用装饰横幅同款） -->
    <rect x="664" y="284" width="460" height="4" fill="#E60012"/>
  </g>

  <rect x="0" y="332" width="1200" height="8" fill="#E60012"/>
</svg>
